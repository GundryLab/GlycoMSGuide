openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tools
    description: MS software tool update tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tool-updates:
    get:
      operationId: listToolUpdates
      tags: [tools]
      summary: List tool update-check status
      description: >
        Returns, for each MS software tool, the date it was last checked for new
        references/releases and whether the latest check found something new.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToolUpdateStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ToolUpdateStatus:
      type: object
      properties:
        toolName:
          type: string
        category:
          type: string
        lastCheckedAt:
          type: string
          format: date-time
        updateAvailable:
          type: boolean
      required:
        - toolName
        - category
        - lastCheckedAt
        - updateAvailable
