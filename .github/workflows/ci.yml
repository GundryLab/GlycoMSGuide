name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm --filter @workspace/glycan-msms run validate:diagnostic-ions
      - run: pnpm --filter @workspace/glycan-msms run validate:monosaccharides
      - run: pnpm --filter @workspace/glycan-msms run build
        env:
          BASE_PATH: /
